<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Giỏ hàng | Beyond Bloom</title>

<style>
:root {
  --pink: #df888c;
  --green: #285a48;
  --cream: #fffaf7;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cream);
  font-family: Arial, sans-serif;
  color: #263b32;
}

header {
  background: white;
  padding: 25px 15px;
  text-align: center;
  border-bottom: 1px solid #f1e2de;
}

header h1 {
  font-family: Georgia, serif;
  color: var(--green);
  font-size: 32px;
  margin: 0;
}

header p {
  color: #a66c72;
}

main {
  max-width: 780px;
  margin: 25px auto;
  padding: 15px;
}

h2 {
  color: var(--green);
  font-size: 23px;
}

.card {
  background: white;
  border: 1px solid #f2e7e3;
  border-radius: 18px;
  padding: 16px;
  margin: 15px 0;
  box-shadow: 0 5px 20px #4c28230b;
}

.product {
  display: flex;
  align-items: center;
  gap: 15px;
}

.product img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 14px;
}

.info {
  flex: 1;
}

.info strong {
  color: var(--green);
  font-size: 18px;
}

.price {
  color: #ce737b;
  margin-top: 8px;
}

.controls {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: flex-end;
  margin-top: 15px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  cursor: pointer;
  font-size: 15px;
}

.primary {
  background: var(--pink);
  color: white;
  font-weight: bold;
}

.outline {
  background: #fff0f0;
  color: #9a4654;
}

.qty {
  background: #f8eeee;
}

.summary {
  position: sticky;
  bottom: 0;
  background: white;
  border-top: 2px solid #f4dada;
  padding: 18px;
  border-radius: 15px 15px 0 0;
  box-shadow: 0 -4px 18px #0000000b;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.total {
  font-size: 22px;
  color: #b85865;
  font-weight: bold;
}

.actions {
  text-align: right;
  margin-top: 15px;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 6px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font: inherit;
}

textarea {
  min-height: 75px;
}

#checkout {
  display: none;
}

#notice {
  display: none;
  background: #e9f7ed;
  padding: 15px;
  border-radius: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 15px;
}

.empty {
  text-align: center;
  color: #687a72;
  padding: 30px 10px;
}

a {
  color: var(--green);
}

.flower-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.flower-option { background: #fff; border: 1px solid #f2e7e3; border-radius: 14px; padding: 15px; }
.flower-option strong { display: block; color: var(--green); margin-bottom: 7px; }
.flower-option .controls { justify-content: space-between; margin-top: 10px; }
.flower-option .controls span { font-weight: bold; }
.flower-option .price { margin: 0; }
.flower-option button { min-width: 42px; }
.flower-add { margin-top: 15px; width: 100%; }
@media(max-width: 520px) { .flower-grid { grid-template-columns: 1fr; } }
button:disabled { opacity: .55; cursor: not-allowed; }

footer {
  text-align: center;
  padding: 25px;
  color: #66746e;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>Beyond Bloom 🌷</h1>
  <p>Giỏ hàng hoa DIY • Bloom Your Way</p>
</header>

<main>

<h2>🛒 Giỏ hàng của bạn <span id="count">(0)</span></h2>

<div id="cart"></div>

<section class="card" aria-labelledby="flowerTitle">
  <h2 id="flowerTitle">🌸 Tự chọn từng bông hoa</h2>
  <p>Chọn loại hoa và số lượng bạn thích, sau đó nhấn <strong>Thêm hoa vào giỏ</strong>.</p>
  <div id="flowerOptions" class="flower-grid"></div>
  <button type="button" class="primary flower-add" id="addFlowersBtn">🌷 Thêm hoa vào giỏ</button>
  <p id="flowerFeedback" role="status" aria-live="polite"></p>
</section>

<p>
  <a href="https://beyondbloom7.wordpress.com/san-pham-dich-vu/">
    ← Tiếp tục chọn hoa
  </a>
</p>

<section id="checkout" class="card">

<h2>📝 Thông tin đặt hoa</h2>

<form id="orderForm">

<label for="name">Họ và tên *</label>
<input id="name" required>

<label for="phone">Số điện thoại *</label>
<input id="phone" type="tel" required
pattern="[0-9+(). -]{9,16}">

<label for="address">Địa chỉ giao hoa *</label>
<textarea id="address" required></textarea>

<label for="date">Ngày nhận hoa *</label>
<input id="date" type="date" required>

<label for="message">Lời nhắn cho người nhận</label>
<textarea id="message"></textarea>

<label for="note">Ghi chú thêm</label>
<textarea id="note"></textarea>


<button class="primary" type="submit">
Xác nhận đơn hàng
</button>

</form>

<div id="notice" role="status"></div>

</section>

<div class="summary">

<div class="row">
<span>
Tổng cộng (<span id="items">0</span> sản phẩm)
</span>

<span id="total" class="total">0 ₫</span>
</div>

<div class="actions">
<button class="primary" id="checkoutBtn" disabled>
Tiến hành đặt hoa
</button>
</div>

</div>

</main>

<footer>
Beyond Bloom 🌷 Gói thương thành hoa
</footer>

<script>

const products = [
  {
    id: "sunshine",
    name: "Sunshine DIY",
    price: 159000,
    image: "sunshine.jpg"
  },
  {
    id: "rose",
    name: "Rose DIY",
    price: 259000,
    image: "rose.jpg"
  },
  {
    id: "hydrangea",
    name: "Hydrangea DIY",
    price: 359000,
    image: "hydrangea.jpg"
  },
  { id: "single-sunflower", name: "Hoa hướng dương", price: 20000, emoji: "🌻" },
  { id: "single-rose", name: "Hoa hồng", price: 14000, emoji: "🌹" },
  { id: "single-lily", name: "Hoa ly", price: 20000, emoji: "🌸" },
  { id: "single-hydrangea", name: "Hoa cẩm tú cầu", price: 35000, emoji: "💐" }
];

const looseFlowers = products.filter(p => p.id.startsWith("single-"));
const flowerQuantities = Object.fromEntries(looseFlowers.map(p => [p.id, 0]));

function renderFlowerOptions() {
  document.getElementById("flowerOptions").innerHTML = looseFlowers.map(p => `
    <div class="flower-option">
      <strong>${p.emoji} ${p.name}</strong>
      <div class="price">${money(p.price)} / bông</div>
      <div class="controls">
        <button type="button" class="qty" data-flower-dec="${p.id}" aria-label="Giảm ${p.name}">−</button>
        <span>${flowerQuantities[p.id]}</span>
        <button type="button" class="qty" data-flower-inc="${p.id}" aria-label="Tăng ${p.name}">+</button>
      </div>
    </div>`).join("");
}

const key = "beyondBloomCartV1";

let cart = {};

try {
  const saved = JSON.parse(localStorage.getItem(key) || "{}");

  if (saved && typeof saved === "object" && !Array.isArray(saved)) {
    products.forEach(p => {
      const n = Number(saved[p.id]);

      if (Number.isInteger(n) && n > 0) {
        cart[p.id] = Math.min(n, 99);
      }
    });
  }
} catch (e) {}

function saveCart() {
  try {
    localStorage.setItem(key, JSON.stringify(cart));
  } catch (e) {}
}

function money(n) {
  return new Intl.NumberFormat("vi-VN", {
    style: "currency",
    currency: "VND"
  }).format(n);
}

function add(id) {
  if (!products.some(p => p.id === id)) return;

  cart[id] = Math.min(99, (cart[id] || 0) + 1);

  saveCart();
  render();
}

function change(id, amount) {
  if (!products.some(p => p.id === id)) return;

  const n = (cart[id] || 0) + amount;

  if (n <= 0) {
    delete cart[id];
  } else {
    cart[id] = Math.min(n, 99);
  }

  saveCart();
  render();
}

function remove(id) {
  delete cart[id];

  saveCart();
  render();
}

function render() {

  const selected = products.filter(p => cart[p.id]);

  const cartElement = document.getElementById("cart");

  if (selected.length === 0) {

    cartElement.innerHTML = `
      <div class="card empty">
        🌷 Giỏ hàng của bạn đang trống!
        <p>Hãy quay lại Beyond Bloom để chọn hoa nhé.</p>
      </div>
    `;

  } else {

    cartElement.innerHTML = selected.map(p => `

      <div class="card">

        <div class="product">

          ${p.image ? `<img src="${p.image}" alt="${p.name}">` : `<div style="font-size:48px;width:100px;text-align:center" aria-hidden="true">${p.emoji}</div>`}

          <div class="info">

            <strong>${p.name}</strong>

            <div class="price">
              ${money(p.price)}
            </div>

          </div>

        </div>

        <div class="controls">

          <button class="outline"
            data-remove="${p.id}">
            🗑 Xóa
          </button>

          <button class="qty"
            data-dec="${p.id}">
            −
          </button>

          <span>${cart[p.id]}</span>

          <button class="qty"
            data-inc="${p.id}">
            +
          </button>

        </div>

      </div>

    `).join("");

  }

  const count = selected.reduce(
    (sum, p) => sum + cart[p.id], 0
  );

  const total = selected.reduce(
    (sum, p) => sum + cart[p.id] * p.price, 0
  );

  document.getElementById("count").textContent = `(${count})`;

  document.getElementById("items").textContent = count;

  document.getElementById("total").textContent = money(total);

  document.getElementById("checkoutBtn").disabled = count === 0;

  if (count === 0) {
    document.getElementById("checkout").style.display = "none";
    document.getElementById("notice").style.display = "none";
  }

}

document.addEventListener("click", e => {

  const button = e.target.closest("button");

  if (!button) return;

  if (button.dataset.flowerInc) {
    const id = button.dataset.flowerInc;
    if (Object.prototype.hasOwnProperty.call(flowerQuantities, id)) {
      flowerQuantities[id] = Math.min(99, flowerQuantities[id] + 1);
      renderFlowerOptions();
    }
    return;
  }

  if (button.dataset.flowerDec) {
    const id = button.dataset.flowerDec;
    if (Object.prototype.hasOwnProperty.call(flowerQuantities, id)) {
      flowerQuantities[id] = Math.max(0, flowerQuantities[id] - 1);
      renderFlowerOptions();
    }
    return;
  }

  if (button.dataset.inc) {
    change(button.dataset.inc, 1);
  }

  if (button.dataset.dec) {
    change(button.dataset.dec, -1);
  }

  if (button.dataset.remove) {
    remove(button.dataset.remove);
  }

});

document.getElementById("addFlowersBtn").addEventListener("click", () => {
  const selected = looseFlowers.filter(p => flowerQuantities[p.id] > 0);
  const feedback = document.getElementById("flowerFeedback");
  if (!selected.length) {
    feedback.textContent = "Vui lòng chọn ít nhất 1 bông hoa nhé!";
    return;
  }
  let added = 0;
  for (const p of selected) {
    const available = Math.max(0, 99 - (cart[p.id] || 0));
    const quantity = Math.min(available, flowerQuantities[p.id]);
    if (quantity > 0) {
      cart[p.id] = (cart[p.id] || 0) + quantity;
      added += quantity;
    }
    flowerQuantities[p.id] = 0;
  }
  saveCart();
  renderFlowerOptions();
  render();
  feedback.textContent = added ? `Đã thêm ${added} bông hoa vào giỏ hàng! 🌷` : "Mỗi loại hoa chỉ được chọn tối đa 99 bông.";
});

renderFlowerOptions();

document.getElementById("checkoutBtn").addEventListener("click", () => {

  document.getElementById("checkout").style.display = "block";

  document.getElementById("checkout").scrollIntoView({
    behavior: "smooth"
  });

});

const today = new Date();
today.setMinutes(today.getMinutes() - today.getTimezoneOffset());

document.getElementById("date").min =
  today.toISOString().slice(0, 10);

document.getElementById("orderForm").addEventListener("submit", async (event) => {

event.preventDefault();

  const selected = products.filter(p => cart[p.id]);

  if (!selected.length) return;

  const total = selected.reduce(
    (sum, p) => sum + cart[p.id] * p.price, 0
  );

  const summary = `
ĐƠN HÀNG BEYOND BLOOM

${selected.map(p =>
  `${p.name} x ${cart[p.id]}: ${money(p.price * cart[p.id])}`
).join("\n")}

TỔNG TIỀN: ${money(total)}

Họ tên: ${document.getElementById("name").value}
SĐT: ${document.getElementById("phone").value}
Địa chỉ: ${document.getElementById("address").value}
Ngày nhận: ${document.getElementById("date").value}
Lời nhắn: ${document.getElementById("message").value}
Ghi chú: ${document.getElementById("note").value}
`;

  const notice = document.getElementById("notice");

  notice.textContent = "⏳ Đang gửi đơn hàng...";
notice.style.display = "block";

try {
  const response = await fetch(
    "https://formsubmit.co/ajax/tramt1108@gmail.com",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        _subject: "Đơn đặt hoa mới - Beyond Bloom",
        "Thông tin đơn hàng": summary
      })
    }
  );

  const result = await response.json();

  if (!response.ok || (result.success !== "true" && result.success !== true)) {
    throw new Error("Không gửi được đơn hàng");
  }

notice.textContent =
  "🌷 ĐẶT HOA THÀNH CÔNG!\n\n" +
  "Beyond Bloom đã nhận được yêu cầu đặt hoa của bạn.\n" +
  "Chúng mình sẽ sớm liên hệ để xác nhận đơn hàng.\n\n" +
  "💗 Cảm ơn bạn đã lựa chọn Beyond Bloom!";
} catch (error) {
  notice.textContent =
    "❌ Chưa gửi được đơn hàng. Vui lòng thử lại.";
}
  

  notice.scrollIntoView({
    behavior: "smooth"
  });

});

const params = new URLSearchParams(window.location.search);

const productId = params.get("add");

if (products.some(p => p.id === productId)) {

  add(productId);

  window.history.replaceState(
    null,
    "",
    window.location.pathname + window.location.hash
  );

} else {
  render();
}

</script>

</body>
</html>
